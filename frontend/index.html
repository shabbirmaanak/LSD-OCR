<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lisan al-Dawat Converter - Alkanz Unicode Converter</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/static/img/logo.png">
    <!-- Google Fonts: Amiri, Scheherazade New, Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Scheherazade+New:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-[#f7f4ee] text-slate-800 min-h-screen flex flex-col antialiased selection:bg-blue-600 selection:text-white">

    <!-- Navigation Header -->
    <header class="bg-white/90 backdrop-blur-md border-b border-[#e6dfd5] sticky top-0 z-40 px-4 py-3 shadow-sm">
        <div class="max-w-[1600px] mx-auto flex items-center justify-between gap-2">
            <div class="flex items-center gap-3">
                <img src="/static/img/logo.png" alt="Lisan Al Dawat Logo" class="w-10 h-10 rounded-xl border border-amber-600/30 object-contain bg-amber-50/20 p-0.5 shadow-sm hover:scale-105 transition">
                <h1 class="text-base sm:text-lg font-bold text-[#0f4c81] tracking-wide">
                    Lisan al-Dawat Converter
                </h1>
            </div>

            <div class="flex items-center gap-2">
                <button id="btn-load-sample" class="bg-[#f3ede3] hover:bg-[#eae3d7] text-[#854d0e] border border-[#d6cbba] px-3 py-1.5 rounded-xl text-xs font-semibold transition flex items-center gap-1.5 shadow-sm">
                    <i class="fa-solid fa-file-lines text-amber-700"></i>
                    <span>Load Sample Text</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Workspace Container -->
    <main class="flex-1 flex flex-col max-w-[1600px] w-full mx-auto p-3 sm:p-5 gap-4">

        <!-- Preset & Rule Configuration Bar -->
        <section id="section-settings" class="bg-white border border-[#e4ded5] rounded-2xl p-3.5 sm:p-4 shadow-sm">
            <div class="flex flex-col lg:flex-row items-center justify-between gap-3">
                
                <!-- Preset Selector -->
                <div class="flex items-center gap-2.5 w-full lg:w-auto">
                    <label class="text-xs font-bold text-[#854d0e] flex items-center gap-1.5 whitespace-nowrap">
                        <i class="fa-solid fa-keyboard"></i>
                        <span>Keyboard Preset:</span>
                    </label>
                    <select id="preset-select" class="bg-[#f7f4ee] border border-[#d8d0c2] text-slate-800 rounded-xl px-3 py-2 text-xs font-semibold focus:outline-none focus:border-[#0f4c81] w-full lg:w-72 shadow-sm">
                        <option value="alkanz_normal" selected>Alkanz Normal Layout</option>
                        <option value="alkanz_urdu">Alkanz Urdu Layout</option>
                        <option value="kanzmarjan">Kanzmarjan Layout</option>
                        <option value="amiri_urdu">Amiri Urdu Layout</option>
                        <option value="custom">Custom Rules</option>
                    </select>
                </div>

                <!-- Rule Table Toggle & File Upload -->
                <div class="flex items-center gap-2 w-full lg:w-auto justify-end flex-wrap sm:flex-nowrap">
                    <button id="btn-toggle-rules" class="bg-[#f3ede3] hover:bg-[#eae3d7] text-slate-800 border border-[#d6cbba] px-3 py-2 rounded-xl text-xs font-medium transition flex items-center gap-1.5 shadow-sm">
                        <i class="fa-solid fa-sliders text-[#854d0e]"></i>
                        <span>View / Edit Rules</span>
                    </button>

                    <button id="btn-upload-top" class="bg-[#0f4c81] hover:bg-[#0c3c66] text-white font-semibold px-3.5 py-2 rounded-xl text-xs shadow-sm transition cursor-pointer flex items-center gap-1.5">
                        <i class="fa-solid fa-file-arrow-up"></i>
                        <span>Upload Document</span>
                    </button>
                    <input type="file" id="file-input" accept=".docx,.txt,.pdf,.png,.jpg,.jpeg,.webp,.bmp,.tiff" class="hidden">
                </div>
            </div>

            <!-- Expandable Rules Editor Table -->
            <div id="rules-editor-panel" class="hidden mt-4 pt-4 border-t border-[#e6dfd5]">
                <div class="flex items-center justify-between mb-2 text-xs">
                    <h3 class="font-bold text-[#854d0e]">Direct Character Replacement Rules:</h3>
                    <button id="btn-add-rule" class="text-xs bg-[#f3ede3] hover:bg-[#eae3d7] text-emerald-800 border border-emerald-300 px-2.5 py-1 rounded transition flex items-center gap-1">
                        <i class="fa-solid fa-plus"></i>
                        <span>Add New Rule Pair</span>
                    </button>
                </div>

                <div class="max-h-48 overflow-y-auto bg-[#fbf9f5] rounded-xl p-3 border border-[#e4ded5]">
                    <div id="rules-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-2 text-xs">
                        <!-- Rule items generated via JS -->
                    </div>
                </div>
            </div>
        </section>

        <!-- Status & Stats Bar -->
        <div id="status-bar" class="bg-white border border-[#e4ded5] px-4 py-2.5 rounded-xl flex items-center justify-between text-xs text-slate-700 shadow-sm">
            <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-600 animate-pulse"></span>
                <span id="status-text" class="font-medium">Ready for instant conversion</span>
            </div>
            <div id="replacement-stats" class="text-[#854d0e] font-bold">
                <span>0 Replacements Made</span>
            </div>
        </div>

        <!-- Single Main Workspace Card: Converted Lisan al-Dawat Unicode Output Editor -->
        <section class="flex-1 flex flex-col min-h-[600px]">
            
            <div id="pane-output" class="bg-white border border-[#e4ded5] rounded-2xl flex-1 flex flex-col shadow-sm min-h-[600px]">
                <!-- Editor Header Toolbar -->
                <div class="bg-[#faf7f2] p-3 border-b border-[#e6dfd5] flex flex-col gap-2.5 text-xs text-slate-800">
                    
                    <!-- Top Row: Title + Font Selector + Upload Font -->
                    <div class="flex items-center justify-between gap-2 flex-wrap">
                        <div class="flex items-center gap-2">
                            <i class="fa-solid fa-wand-magic-sparkles text-emerald-700 text-sm"></i>
                            <span class="font-bold text-emerald-900 text-sm">Converted Text Output</span>
                        </div>

                        <div class="flex items-center gap-2">
                            <select id="font-select" dir="ltr" class="bg-white border border-[#d8d0c2] rounded-xl text-slate-800 text-xs px-3 py-1.5 focus:outline-none focus:border-[#0f4c81] font-sans font-semibold shadow-sm">
                                <option value="Al Kanz" selected>Al Kanz</option>
                                <option value="Al Fatemi">Al Fatemi</option>
                                <option value="Kanz al Marjaan">Kanz al Marjaan</option>
                                <option value="Kanz al Yaqoot">Kanz al Yaqoot</option>
                                <option value="Kanz al Lulu">Kanz al Lulu</option>
                                <optgroup id="optgroup-custom-fonts" label="Custom Preset Fonts">
                                    <!-- Extra font options -->
                                </optgroup>
                            </select>

                            <button id="btn-upload-font" class="bg-[#f3ede3] hover:bg-[#eae3d7] text-[#854d0e] border border-[#d6cbba] px-2.5 py-1.5 rounded-xl text-xs font-semibold transition flex items-center gap-1 shadow-sm" title="Upload Custom Font (TTF, OTF, WOFF)">
                                <i class="fa-solid fa-font text-xs"></i>
                                <span>+ Font</span>
                            </button>
                            <input type="file" id="font-file-input" accept=".ttf,.otf,.woff,.woff2" class="hidden">
                        </div>
                    </div>

                    <!-- Bottom Row: Clean Responsive Action Buttons Bar -->
                    <div class="grid grid-cols-2 sm:grid-cols-6 gap-2 pt-1 border-t border-amber-900/10">
                        <button id="btn-upload-pane" class="bg-[#0f4c81] hover:bg-[#0c3c66] text-white font-semibold py-2 px-2 rounded-xl text-xs shadow-sm transition flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-file-arrow-up text-blue-200"></i>
                            <span>Upload File</span>
                        </button>
                        <input type="file" id="file-input-pane" accept=".docx,.txt,.pdf,.png,.jpg,.jpeg,.webp,.bmp,.tiff" class="hidden">

                        <button id="btn-paste-input" class="bg-[#f3ede3] hover:bg-[#eae3d7] text-[#854d0e] font-semibold py-2 px-2 rounded-xl text-xs border border-[#d6cbba] shadow-sm transition flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-paste text-[#854d0e]"></i>
                            <span>Paste</span>
                        </button>

                        <button id="btn-reverse-flow" class="bg-[#f3ede3] hover:bg-[#eae3d7] text-indigo-900 font-semibold py-2 px-2 rounded-xl text-xs border border-[#d6cbba] shadow-sm transition flex items-center justify-center gap-1.5" title="Flip/reverse word order for LTR PDF streams">
                            <i class="fa-solid fa-right-left text-indigo-700"></i>
                            <span>Reverse Flow</span>
                        </button>

                        <button id="btn-copy-text" class="bg-[#f3ede3] hover:bg-[#eae3d7] text-slate-800 font-semibold py-2 px-2 rounded-xl text-xs border border-[#d6cbba] shadow-sm transition flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-copy text-slate-700"></i>
                            <span>Copy</span>
                        </button>

                        <button id="btn-export-docx" class="bg-emerald-700 hover:bg-emerald-800 text-white font-semibold py-2 px-2 rounded-xl text-xs shadow-sm transition flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-file-word text-sm"></i>
                            <span>Export Word</span>
                        </button>

                        <button id="btn-clear-input" class="bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 font-semibold py-2 px-2 rounded-xl text-xs shadow-sm transition flex items-center justify-center gap-1.5 col-span-2 sm:col-span-1">
                            <i class="fa-solid fa-trash-can text-xs"></i>
                            <span>Clear</span>
                        </button>
                    </div>
                </div>

                <!-- Single Main Editor Textarea Container -->
                <div id="input-drop-zone" class="flex-1 p-4 bg-[#fbf9f5] flex flex-col relative min-h-[500px]">
                    
                    <!-- Drag and Drop Overlay Indicator -->
                    <div id="drop-overlay" class="hidden absolute inset-0 bg-blue-600/10 backdrop-blur-sm border-2 border-dashed border-blue-600 z-30 flex flex-col items-center justify-center gap-3 text-blue-900 pointer-events-none">
                        <i class="fa-solid fa-cloud-arrow-up text-5xl animate-bounce text-blue-700"></i>
                        <p class="font-bold text-sm">Drop document here for instant conversion (.docx, .pdf, .txt)</p>
                    </div>

                    <textarea id="output-editor" dir="rtl" class="w-full min-h-[500px] sm:min-h-[600px] flex-1 bg-transparent border-0 text-slate-800 font-amiri text-lg sm:text-xl leading-relaxed focus:outline-none resize-y p-2" placeholder="Paste your text or upload a document (.pdf, .docx, .txt) to convert..."></textarea>
                    <textarea id="input-editor" class="hidden"></textarea>
                </div>
            </div>

        </section>

    </main>

    <!-- Aesthetic Uploading Preloader Overlay Modal -->
    <div id="upload-preloader" class="hidden fixed inset-0 z-50 bg-stone-900/40 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white border border-stone-200/80 rounded-3xl p-6 sm:p-8 max-w-xs sm:max-w-sm w-full shadow-2xl flex flex-col items-center text-center gap-4 animate-in fade-in zoom-in duration-200">
            <!-- Circular Animated Progress Fill Ring -->
            <div class="relative w-20 h-20 flex items-center justify-center">
                <svg class="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                    <path class="text-stone-100" stroke-width="3" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                    <path id="preloader-progress-circle" class="text-emerald-600 transition-all duration-300 ease-out" stroke-dasharray="0, 100" stroke-width="3.2" stroke-linecap="round" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                </svg>
                <div class="absolute inset-0 flex items-center justify-center flex-col">
                    <span id="preloader-percent-text" class="text-lg font-bold text-stone-800 font-sans">0%</span>
                </div>
            </div>

            <div>
                <h3 id="preloader-title" class="font-bold text-stone-800 text-sm sm:text-base mb-1">Extracting & Converting Document...</h3>
                <p id="preloader-subtext" class="text-xs text-stone-500">Applying Lisan al-Dawat rules and auto-fixing sentence flow</p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/static/js/ruleManager.js"></script>
    <script src="/static/js/editor.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
